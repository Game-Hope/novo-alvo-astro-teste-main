name: Ingest News
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/45 * * * *' # Roda a cada 45 min
  workflow_dispatch: # Permite rodar manualmente

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install # Mudamos de 'npm ci' para 'npm install' para evitar erro de lock file

      - name: Run ingest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: npm run ingest:news

      - name: Commit and Push changes
        run: |
          git config --global user.name "NEXA-BOT"
          git config --global user.email "bot@nexa.ai"
          git add .
          git commit -m "NEXA: Auto-ingest updates" || echo "No changes to commit"
          git push
